<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming API — Passkey</title><style>:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#4f8cff1a,transparent 40%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.card{width:min(470px,100%);padding:30px;border:1px solid var(--line);border-radius:20px;background:#0c1320;box-shadow:0 30px 90px #0008;text-align:center}.icon{width:60px;height:60px;margin:0 auto 15px;display:grid;place-items:center;border-radius:17px;background:#4f8cff18;font-size:27px}.muted{color:var(--muted);font-size:13px;line-height:1.65}.btn{width:100%;padding:13px;margin-top:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#2563eb);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.link{display:block;margin-top:15px;color:#75a6ff;font-size:12px}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;font-size:12px;white-space:pre-line}.show{display:block}.error{background:#ff647814;color:#ff9daa}.success{background:#20c99714;color:#70e4bf}</style></head><body><section class="card"><div class="icon">⌁</div><h1>Add a passkey</h1><p class="muted">Use this device, your phone, a password manager, or another WebAuthn authenticator. Your browser will open the platform passkey prompt.</p><button id="add" class="btn">Create passkey</button><a class="link" href="/dashboard.html">Return to dashboard</a><div id="msg" class="msg"></div></section><script type="module">
