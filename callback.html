<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming API — Secure sign in</title><style>:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5;--blue:#4f8cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#4f8cff1b,transparent 40%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.card{width:min(460px,calc(100% - 40px));padding:32px;border:1px solid var(--line);border-radius:20px;background:#0c1320;box-shadow:0 30px 90px #0008;text-align:center}.loader{width:44px;height:44px;margin:0 auto 20px;border:4px solid #ffffff14;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:var(--muted);font-size:13px;line-height:1.6}.error{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#ff647814;color:#ff9daa;font-size:12px}.show{display:block}a{color:#75a6ff}</style></head><body><section class="card"><div class="loader" id="loader"></div><h2 id="title">Securing your session</h2><p id="status">Completing authentication and checking account security…</p><div id="error" class="error"></div></section><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.105.0';const supabase=createClient('https://qbagxeqquskkjksoraiz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk',{auth:{experimental:{passkey:true}}});const BASE='https://game-api.online',$=x=>document.getElementById(x);function fail(t){$('loader').style.display='none';$('status').textContent='We could not complete your sign-in.';$('error').textContent=t;$('error').className='error show'}
async function run(){try{await supabase.auth.getSession();const{data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session)return fail('No authenticated session was found. Please return to the sign-in page.');$('status').textContent='Checking your security settings…';const{data:aal,error:ae}=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();if(ae)throw ae;if(aal.currentLevel==='aal2'){location.replace(BASE+'/dashboard.html');return}const{data:factors,error:fe}=await supabase.auth.mfa.listFactors();if(fe)throw fe;const hasTotp=(factors?.totp||[]).some(f=>f.status==='verified');if(hasTotp){location.replace(BASE+'/verify-mfa.html');return}location.replace(BASE+'/dashboard.html')}catch(e){console.error(e);fail(e.message||'Authentication failed.')}}run();</script></body></html>
