<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaming API — Sign in</title>
<style>
:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5;--blue:#4f8cff;--blue2:#2563eb;--green:#20c997;--red:#ff6478}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#4f8cff22,transparent 32%),radial-gradient(circle at 85% 85%,#7c3aed1c,transparent 30%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(480px,100%)}.brand{text-align:center;margin-bottom:20px}.logo{width:60px;height:60px;margin:auto;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,var(--blue),#7c3aed);font-size:26px;font-weight:900;box-shadow:0 18px 45px #4f8cff25}.brand h1{font-size:26px;margin:12px 0 5px}.brand p{margin:0;color:var(--muted);font-size:12px}.card{padding:29px;border:1px solid var(--line);border-radius:21px;background:#0c1320ee;box-shadow:0 30px 90px #0008;backdrop-filter:blur(16px)}h2{margin:0 0 7px;font-size:21px}.desc{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 22px}label{display:block;margin:0 0 7px;color:#cbd5e1;font-size:11px;font-weight:700}.field{margin-bottom:15px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#fff;outline:none;font-size:13px}input:focus{border-color:#4f8cff99;box-shadow:0 0 0 3px #4f8cff16}input::placeholder{color:#58657a}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:not-allowed}.passkey{margin-top:10px;background:#ffffff08;border:1px solid #ffffff18}.email-code{margin-top:10px;background:transparent;border:1px solid #4f8cff55}.divider{display:flex;align-items:center;gap:12px;margin:21px 0;color:#5e6b80;font-size:10px;text-transform:uppercase}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.oauth{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oauth button,.secondary{padding:12px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff08;color:#fff;cursor:pointer;font-weight:700}.oauth button:hover,.secondary:hover{background:#ffffff0e}.switch{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}.switch button{border:0;background:none;color:#75a6ff;cursor:pointer;font-weight:800}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:11px;line-height:1.5;white-space:pre-line}.msg.show{display:block}.error{background:#ff647814;color:#ff9daa;border:1px solid #ff64781f}.success{background:#20c99714;color:#70e4bf;border:1px solid #20c9971f}.otp{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.otp.show{display:block}.otp input{text-align:center;letter-spacing:8px;font-size:20px}.footer{text-align:center;color:#4f5b70;font-size:10px;margin-top:18px}.secure{text-align:center;color:#68758a;font-size:10px;margin-top:12px}@media(max-width:520px){.oauth{grid-template-columns:1fr}.card{padding:22px}}
</style>
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = 'beda616dd447f33383e535fee445f90330797c47';
window.smartsupp||(function(d){var s,c,o=smartsupp=function(){o._.push(arguments)};o._=[];s=d.getElementsByTagName('script')[0];c=d.createElement('script');c.type='text/javascript';c.charset='utf-8';c.async=true;c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s)})(document);
</script>
</head>
<body>
<main class="wrap">
<header class="brand"><div class="logo">G</div><h1>Gaming API</h1><p>Secure developer platform</p></header>
<section class="card">
<h2 id="title">Welcome back</h2>
<p class="desc" id="desc">Sign in securely to access your Gaming API dashboard.</p>
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
<button class="btn" id="emailBtn">Sign in</button>
<button class="btn passkey" id="passkeyBtn">Sign in with Passkey</button>
<button class="btn email-code" id="sendCode">Sign in with Email Code</button>
<div class="divider">or continue with</div>
<div class="oauth"><button id="github">Continue with GitHub</button><button id="google">Continue with Google</button></div>
<div class="otp" id="otpBox"><label for="otp">Email verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button class="btn" id="verifyOtp" style="margin-top:10px">Verify code</button><button class="secondary" id="resendOtp" style="width:100%;margin-top:8px">Resend code</button></div>
<div id="msg" class="msg"></div>
<div class="switch"><span id="switchText">Don't have an account?</span> <button id="switch">Create account</button></div>
</section>
<div class="secure">Protected by Supabase Auth · game-api.online</div>
<div class="footer">Gaming API · Secure Authentication</div>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.105.0';
const SUPABASE_URL='https://qbagxeqquskkjksoraiz.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const CALLBACK='https://game-api.online/callback.html';
const $=id=>document.getElementById(id);let signup=false,lastEmail='';
function msg(text,type='error'){$('msg').textContent=text;$('msg').className='msg show '+type}function clear(){ $('msg').className='msg';$('msg').textContent=''}
$('switch').onclick=()=>{signup=!signup;clear();$('otpBox').classList.remove('show');$('title').textContent=signup?'Create your account':'Welcome back';$('desc').textContent=signup?'Create a secure Gaming API account.':'Sign in securely to access your Gaming API dashboard.';$('emailBtn').textContent=signup?'Create account':'Sign in';$('passkeyBtn').style.display=signup?'none':'block';$('sendCode').style.display=signup?'none':'block';$('switchText').textContent=signup?'Already have an account?':"Don't have an account?";$('switch').textContent=signup?'Sign in':'Create account'};
$('emailBtn').onclick=async()=>{clear();const e=$('email').value.trim(),p=$('password').value;if(!e||!p)return msg('Enter your email and password.');$('emailBtn').disabled=true;$('emailBtn').textContent=signup?'Creating account…':'Signing in…';try{if(signup){const{data,error}=await supabase.auth.signUp({email:e,password:p,emailRedirectTo:CALLBACK});if(error)throw error;if(!data.session){msg('Account created successfully. Check your email and verify your email address before signing in.','success')}else location.replace(CALLBACK)}else{const{data,error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error)throw error;if(!data.session)throw Error('No authenticated session was created.');location.replace(CALLBACK)}}catch(e){msg(e.message||'Authentication failed.')}finally{$('emailBtn').disabled=false;$('emailBtn').textContent=signup?'Create account':'Sign in'}};
$('passkeyBtn').onclick=async()=>{clear();$('passkeyBtn').disabled=true;$('passkeyBtn').textContent='Waiting for passkey…';try{if(!supabase.auth.signInWithPasskey)throw Error('Passkey sign-in is not available in this Supabase Auth client.');const{error}=await supabase.auth.signInWithPasskey();if(error)throw error;location.replace(CALLBACK)}catch(e){msg(e.message||'Passkey sign-in failed.')}finally{$('passkeyBtn').disabled=false;$('passkeyBtn').textContent='Sign in with Passkey'}};
async function oauth(provider,button){clear();button.disabled=true;button.textContent='Connecting…';try{const{error}=await supabase.auth.signInWithOAuth({provider,options:{redirectTo:CALLBACK}});if(error)throw error}catch(e){msg(e.message||'OAuth sign-in failed.');button.disabled=false;button.textContent=provider==='github'?'Continue with GitHub':'Continue with Google'}}
$('github').onclick=()=>oauth('github',$('github'));$('google').onclick=()=>oauth('google',$('google'));
async function sendOtp(){clear();const e=$('email').value.trim();if(!e)return msg('Enter your email address first.');$('sendCode').disabled=true;$('sendCode').textContent='Sending code…';try{const{error}=await supabase.auth.signInWithOtp({email:e,options:{shouldCreateUser:false,emailRedirectTo:CALLBACK}});if(error)throw error;lastEmail=e;$('otpBox').classList.add('show');msg('A one-time verification code has been sent to your email.','success');$('otp').focus()}catch(e){msg(e.message||'Could not send code.')}finally{$('sendCode').disabled=false;$('sendCode').textContent='Sign in with Email Code'}}
$('sendCode').onclick=sendOtp;$('resendOtp').onclick=sendOtp;
$('verifyOtp').onclick=async()=>{clear();const code=$('otp').value.trim();if(!lastEmail)return msg('Request an email code first.');if(!/^\d{6}$/.test(code))return msg('Enter the six-digit verification code.');$('verifyOtp').disabled=true;$('verifyOtp').textContent='Verifying…';try{const{data,error}=await supabase.auth.verifyOtp({email:lastEmail,token:code,type:'email'});if(error)throw error;if(!data.session)throw Error('Verification succeeded but no session was created.');location.replace(CALLBACK)}catch(e){msg(e.message||'Verification failed.')}finally{$('verifyOtp').disabled=false;$('verifyOtp').textContent='Verify code'}};
</script>
</body>
</html>
