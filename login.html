<!doctype html>
<html lang="en">
<head>

<title>Gaming API — Sign in</title>
<style>
:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5;--blue:#4f8cff;--blue2:#2563eb;--green:#20c997;--red:#ff6478}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#4f8cff22,transparent 32%),radial-gradient(circle at 85% 85%,#7c3aed1c,transparent 30%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(480px,100%)}.brand{text-align:center;margin-bottom:20px}.logo{width:60px;height:60px;margin:auto;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,var(--blue),#7c3aed);font-size:26px;font-weight:900;box-shadow:0 18px 45px #4f8cff25}.brand h1{font-size:26px;margin:12px 0 5px}.brand p{margin:0;color:var(--muted);font-size:12px}.card{padding:29px;border:1px solid var(--line);border-radius:21px;background:#0c1320ee;box-shadow:0 30px 90px #0008;backdrop-filter:blur(16px)}h2{margin:0 0 7px;font-size:21px}.desc{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 22px}label{display:block;margin:0 0 7px;color:#cbd5e1;font-size:11px;font-weight:700}.field{margin-bottom:15px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#fff;outline:none;font-size:13px}input:focus{border-color:#4f8cff99;box-shadow:0 0 0 3px #4f8cff16}input::placeholder{color:#58657a}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:not-allowed}.passkey{margin-top:10px;background:#ffffff08;border:1px solid #ffffff18}.email-code{margin-top:10px;background:transparent;border:1px solid #4f8cff55}.divider{display:flex;align-items:center;gap:12px;margin:21px 0;color:#5e6b80;font-size:10px;text-transform:uppercase}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.oauth{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oauth button,.secondary{padding:12px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff08;color:#fff;cursor:pointer;font-weight:700}.oauth button:hover,.secondary:hover{background:#ffffff0e}.oauth button{display:flex;align-items:center;justify-content:center;gap:9px}.provider-logo{width:18px;height:18px;display:block;flex:0 0 18px}.provider-name{line-height:1}.oauth-disabled .provider-logo{filter:grayscale(1)}.oauth-disabled{opacity:.5!important;cursor:not-allowed!important}.oauth-disabled span{display:block;font-size:8px;margin-top:3px;color:#91a0b5}.oauth-note{text-align:center;color:#5e6b80;font-size:9px;margin-top:10px}.switch{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}.switch button{border:0;background:none;color:#75a6ff;cursor:pointer;font-weight:800}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:11px;line-height:1.5;white-space:pre-line}.msg.show{display:block}.error{background:#ff647814;color:#ff9daa;border:1px solid #ff64781f}.success{background:#20c99714;color:#70e4bf;border:1px solid #20c9971f}.otp{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.otp.show{display:block}.otp input{text-align:center;letter-spacing:8px;font-size:20px}.footer{text-align:center;color:#4f5b70;font-size:10px;margin-top:18px}.secure{text-align:center;color:#68758a;font-size:10px;margin-top:12px}@media(max-width:520px){.oauth{grid-template-columns:1fr}.card{padding:22px}}
</style>
<script type="text/javascript">

_smartsupp.key = 'beda616dd447f33383e535fee445f90330797c47';
window.smartsupp||(function(d){var s,c,o=smartsupp=function(){o._.push(arguments)};o._=[];s=d.getElementsByTagName('script')[0];c=d.createElement('script');c.type='text/javascript';c.charset='utf-8';c.async=true;c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s)})(document);
</script>
</head>
<body>
<main class="wrap">
<header class="brand"><div class="logo">G</div><h1>Gaming API</h1><p>Secure developer platform</p></header>
<section class="card">
<h2 id="title">Welcome back</h2>
<p class="desc" id="desc">Sign in securely to access your Gaming API dashboard.</p>
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
<button class="btn" id="emailBtn">Sign in</button>
<button class="btn passkey" id="passkeyBtn">Sign in with Passkey</button>
<button class="btn email-code" id="sendCode">Sign in with Email Code</button>
<div class="divider">or continue with</div>
<div class="oauth"><button id="github" class="" type="button"><svg class="provider-logo" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .6a11.4 11.4 0 0 0-3.6 22.2c.57.1.78-.25.78-.55v-2.16c-3.17.69-3.84-1.34-3.84-1.34-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.72-1.54-2.53-.29-5.19-1.27-5.19-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.03 0 0 .96-.31 3.14 1.17A10.9 10.9 0 0 1 12 6.02c.97 0 1.94.13 2.85.38 2.18-1.48 3.14-1.17 3.14-1.17.62 1.58.23 2.74.11 3.03.73.8 1.18 1.82 1.18 3.07 0 4.4-2.67 5.36-5.21 5.65.41.36.77 1.08.77 2.18v3.23c0 .3.21.65.79.54A11.4 11.4 0 0 0 12 .6Z"/></svg><span class="provider-name">GitHub</span></button><button id="google" class="" type="button"><svg class="provider-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.72-.06-1.25-.2-1.8H12v3.4h5.52a4.7 4.7 0 0 1-2.05 3.08v2.53h3.32c1.94-1.79 2.81-4.43 2.81-7.21Z"/><path fill="#34A853" d="M12 22c2.76 0 5.08-.91 6.77-2.46l-3.32-2.53c-.92.62-2.1 1-3.45 1-2.65 0-4.9-1.79-5.7-4.2H2.87v2.61A10.23 10.23 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.3 13.81A6.15 6.15 0 0 1 5.98 12c0-.63.11-1.24.32-1.81V7.58H2.87A10.24 10.24 0 0 0 1.78 12c0 1.6.38 3.12 1.09 4.42l3.43-2.61Z"/><path fill="#EA4335" d="M12 5.98c1.5 0 2.84.52 3.9 1.54l2.92-2.92C17.07 2.91 14.76 2 12 2a10.23 10.23 0 0 0-9.13 5.58L6.3 10.19c.8-2.42 3.05-4.21 5.7-4.21Z"/></svg><span class="provider-name">Google</span></button><button  class="oauth-disabled" type="button" disabled><svg class="provider-logo" viewBox="0 0 24 24" aria-hidden="true" fill="#1877F2"><path d="M24 12.07C24 5.44 18.63.07 12 .07S0 5.44 0 12.07c0 5.99 4.39 10.95 10.13 11.86v-8.39H7.08v-3.47h3.05V9.43c0-3.01 1.79-4.68 4.54-4.68 1.31 0 2.68.23 2.68.23v2.95h-1.51c-1.49 0-1.96.92-1.96 1.87v2.25h3.34l-.53 3.47h-2.81v8.39C19.61 23.02 24 18.06 24 12.07Z"/></svg><span class="provider-name">Facebook</span><span>Unavailable</span></button><button  class="oauth-disabled" type="button" disabled><svg class="provider-logo" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M16.77 12.75c.02 2.22 1.95 2.96 1.97 2.97-.02.05-.31 1.08-1.02 2.14-.61.91-1.25 1.82-2.25 1.84-.98.02-1.3-.59-2.43-.59-1.14 0-1.49.57-2.42.61-.97.04-1.71-.98-2.33-1.89-1.27-1.84-2.24-5.2-.94-7.47.65-1.13 1.8-1.84 3.05-1.86.95-.02 1.85.64 2.42.64.57 0 1.64-.79 2.77-.68.47.02 1.79.19 2.64 1.43-.07.04-1.58.92-1.56 2.76ZM14.95 5.67c.51-.62.86-1.49.76-2.36-.74.03-1.63.49-2.15 1.1-.47.54-.88 1.42-.77 2.25.82.06 1.65-.41 2.16-.99Z"/></svg><span class="provider-name">Apple</span><span>Unavailable</span></button><button  class="oauth-disabled" type="button" disabled><svg class="provider-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FC6D26" d="m12 21.2-3.55-10.93h7.1L12 21.2Z"/><path fill="#E24329" d="M12 21.2 5.35 10.27h3.1L12 21.2Z"/><path fill="#FCA326" d="m5.35 10.27 1.92-5.9c.1-.3.52-.3.62 0l1.46 5.9h-4Z"/><path fill="#E24329" d="m12 21.2 6.65-10.93h-3.1L12 21.2Z"/><path fill="#FCA326" d="m18.65 10.27-1.92-5.9c-.1-.3-.52-.3-.62 0l-1.46 5.9h4Z"/><path fill="#FC6D26" d="m5.35 10.27 6.65 10.93 6.65-10.93H5.35Z"/></svg><span class="provider-name">GitLab</span><span>Unavailable</span></button></div><div class="oauth-note">Facebook, Apple and GitLab sign-in are coming soon.</div>
<div class="otp" id="otpBox"><label for="otp">Email verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button class="btn" id="verifyOtp" style="margin-top:10px">Verify code</button><button class="secondary" id="resendOtp" style="width:100%;margin-top:8px">Resend code</button></div>
<div id="msg" class="msg"></div>
<div class="switch"><span id="switchText">Don't have an account?</span> <button id="switch">Create account</button></div>
</section>
<div class="secure">Protected by Supabase Auth · game-api.online</div>
<div class="footer">Gaming API · Secure Authentication</div>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.105.0';
const SUPABASE_URL='https://qbagxeqquskkjksoraiz.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,experimental:{passkey:true}}});
const CALLBACK='https://game-api.online/callback.html';
const $=id=>document.getElementById(id);let signup=false,lastEmail='';
function msg(text,type='error'){$('msg').textContent=text;$('msg').className='msg show '+type}function clear(){$('msg').className='msg';$('msg').textContent=''}
$('switch').onclick=()=>{signup=!signup;clear();$('otpBox').classList.remove('show');$('title').textContent=signup?'Create your account':'Welcome back';$('desc').textContent=signup?'Create a secure Gaming API account.':'Sign in securely to access your Gaming API dashboard.';$('emailBtn').textContent=signup?'Create account':'Sign in';$('passkeyBtn').style.display=signup?'none':'block';$('sendCode').style.display=signup?'none':'block';$('switchText').textContent=signup?'Already have an account?':"Don't have an account?";$('switch').textContent=signup?'Sign in':'Create account'};
$('emailBtn').onclick=async()=>{clear();const e=$('email').value.trim(),p=$('password').value;if(!e||!p)return msg('Enter your email and password.');$('emailBtn').disabled=true;$('emailBtn').textContent=signup?'Creating account…':'Signing in…';try{if(signup){const{data,error}=await supabase.auth.signUp({email:e,password:p,emailRedirectTo:CALLBACK});if(error)throw error;if(!data.session){msg('Account created successfully. Check your email and verify your email address before signing in.','success')}else location.replace(CALLBACK)}else{const{data,error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error)throw error;if(!data.session)throw Error('No authenticated session was created.');location.replace(CALLBACK)}}catch(e){msg(e.message||'Authentication failed.')}finally{$('emailBtn').disabled=false;$('emailBtn').textContent=signup?'Create account':'Sign in'}};
$('passkeyBtn').onclick=async()=>{clear();$('passkeyBtn').disabled=true;$('passkeyBtn').textContent='Waiting for passkey…';try{if(!supabase.auth.signInWithPasskey)throw Error('Passkey sign-in is not available in this Supabase Auth client.');const{error}=await supabase.auth.signInWithPasskey();if(error)throw error;location.replace(CALLBACK)}catch(e){msg(e.message||'Passkey sign-in failed.')}finally{$('passkeyBtn').disabled=false;$('passkeyBtn').textContent='Sign in with Passkey'}};
async function oauth(provider,button){clear();button.disabled=true;button.textContent='Connecting…';try{const{error}=await supabase.auth.signInWithOAuth({provider,options:{redirectTo:CALLBACK}});if(error)throw error}catch(e){msg(e.message||'OAuth sign-in failed.');button.disabled=false;button.textContent=provider==='github'?'Continue with GitHub':'Continue with Google'}}
$('github').onclick=()=>oauth('github',$('github'));$('google').onclick=()=>oauth('google',$('google'));
async function sendOtp(){clear();const e=$('email').value.trim();if(!e)return msg('Enter your email address first.');$('sendCode').disabled=true;$('sendCode').textContent='Sending code…';try{const{error}=await supabase.auth.signInWithOtp({email:e,options:{shouldCreateUser:false}});if(error)throw error;lastEmail=e;$('otpBox').classList.add('show');msg('A one-time verification code has been sent to your email.','success');$('otp').focus()}catch(e){msg(e.message||'Could not send code.')}finally{$('sendCode').disabled=false;$('sendCode').textContent='Sign in with Email Code'}}
$('sendCode').onclick=sendOtp;$('resendOtp').onclick=sendOtp;
$('verifyOtp').onclick=async()=>{clear();const code=$('otp').value.trim();if(!lastEmail)return msg('Request an email code first.');if(!/^\d{6}$/.test(code))return msg('Enter the six-digit verification code.');$('verifyOtp').disabled=true;$('verifyOtp').textContent='Verifying…';try{const{data,error}=await supabase.auth.verifyOtp({email:lastEmail,token:code,type:'email'});if(error)throw error;if(!data.session)throw Error('Verification succeeded but no session was created.');location.replace(CALLBACK)}catch(e){msg(e.message||'Verification failed. Please request a new code and try again.')}finally{$('verifyOtp').disabled=false;$('verifyOtp').textContent='Verify code'}};
</script>
</body>
</html>
