<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming API — Authenticator</title><style>:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5;--blue:#4f8cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#4f8cff1e,transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.card{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:20px;background:#0c1320;box-shadow:0 30px 90px #0008;text-align:center}.icon{width:56px;height:56px;margin:0 auto 15px;display:grid;place-items:center;border-radius:16px;background:#4f8cff18;color:#75a6ff;font-size:25px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.code{width:100%;padding:15px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#fff;text-align:center;font-size:25px;letter-spacing:9px;outline:none}.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#2563eb);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.link{display:block;margin-top:14px;color:#75a6ff;font-size:12px;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:12px}.show{display:block}.error{background:#ff647814;color:#ff9daa}.success{background:#20c99714;color:#70e4bf}</style></head><body><section class="card"><div class="icon">⌁</div><h1>Authenticator verification</h1><p class="muted">Enter the 6-digit code from your Google Authenticator app to finish signing in.</p><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="verify" class="btn">Verify and continue</button><span id="logout" class="link">Sign out</span><div id="msg" class="msg"></div></section><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.105.0';const supabase=createClient('https://qbagxeqquskkjksoraiz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk');const BASE='https://game-api.online',$=x=>document.getElementById(x);let factorId='';function msg(t,c='error'){$('msg').textContent=t;$('msg').className='msg show '+c}async function init(){try{const{data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session)return location.replace(BASE+'/login.html');const{data:f,error:fe}=await supabase.auth.mfa.listFactors();if(fe)throw fe;const factor=(f.totp||[]).find(x=>x.status==='verified');if(!factor)return location.replace(BASE+'/dashboard.html');factorId=factor.id}catch(e){msg(e.message||'Unable to load MFA.')}}init();$('verify').onclick=async()=>{const code=$('code').value.trim();if(!factorId)return msg('No verified authenticator was found.');if(!/^\d{6}$/.test(code))return msg('Enter the six-digit code.');$('verify').disabled=true;try{const ch=await supabase.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;const v=await supabase.auth.mfa.verify({factorId,challengeId:ch.data.id,code});if(v.error)throw v.error;msg('Verified. Opening dashboard…','success');setTimeout(()=>location.replace(BASE+'/dashboard.html'),400)}catch(e){msg(e.message||'The authenticator code is invalid.')}finally{$('verify').disabled=false}};$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace(BASE+'/login.html')};</script></body></html>
