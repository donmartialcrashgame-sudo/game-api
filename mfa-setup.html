<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming API — Set up Authenticator</title><style>:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5;--blue:#4f8cff;--green:#20c997}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#4f8cff1d,transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.card{width:min(500px,100%);padding:30px;border:1px solid var(--line);border-radius:20px;background:#0c1320;box-shadow:0 30px 90px #0008}.muted{color:var(--muted);font-size:13px;line-height:1.65}.qr{display:block;width:220px;height:220px;margin:18px auto;padding:10px;background:#fff;border-radius:12px}.secret{padding:11px;background:#ffffff08;border:1px solid var(--line);border-radius:9px;font-family:monospace;word-break:break-all}.code{width:100%;box-sizing:border-box;margin-top:15px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#fff;text-align:center;font-size:22px;letter-spacing:8px}.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#2563eb);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.back{display:block;margin-top:14px;text-align:center;color:#75a6ff;font-size:12px}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;font-size:12px;white-space:pre-line}.show{display:block}.error{background:#ff647814;color:#ff9daa}.success{background:#20c99714;color:#70e4bf}.warning{padding:12px;margin-top:15px;border-radius:9px;background:#f59e0b12;color:#f7c66a;font-size:11px;line-height:1.6}</style></head><body><section class="card"><h1>Protect your account</h1><p class="muted">Add Google Authenticator for an additional layer of security. After setup, future sign-ins will ask for the 6-digit authenticator code.</p><div id="setup"><p class="muted">Preparing secure setup…</p></div><label for="code" style="display:block;margin-top:16px;font-size:11px;font-weight:700">Authenticator code</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="verify" class="btn">Enable authenticator</button><a class="back" href="/dashboard.html">Return to dashboard</a><div id="msg" class="msg"></div></section><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.105.0';const supabase=createClient('https://qbagxeqquskkjksoraiz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk');const $=x=>document.getElementById(x);let factorId='';function msg(t,c='error'){$('msg').textContent=t;$('msg').className='msg show '+c}async function init(){try{const{data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session)return location.replace('/login.html');const{data:f,error:fe}=await supabase.auth.mfa.listFactors();if(fe)throw fe;const verified=(f.totp||[]).find(x=>x.status==='verified');if(verified){factorId=verified.id;$('setup').innerHTML='<p class="muted">Google Authenticator is already enabled on this account.</p>';$('verify').textContent='Verify authenticator';return}const{data,error:en}=await supabase.auth.mfa.enroll({factorType:'totp',friendlyName:'Gaming API Authenticator'});if(en)throw en;factorId=data.id;const uri=data.totp.uri,secret=data.totp.secret;$('setup').innerHTML='<p class="muted">Scan this QR code with Google Authenticator or another TOTP app.</p><img class="qr" alt="Authenticator QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(uri)+'"><p class="muted">Can’t scan? Use this setup key:</p><div class="secret">'+secret+'</div><div class="warning">Save your recovery plan before leaving this page. Recovery-code issuance will be handled by the secure account-security backend; this page never stores recovery codes in browser code.</div>'}catch(e){msg(e.message||'Unable to prepare authenticator setup.')}}init();$('verify').onclick=async()=>{const code=$('code').value.trim();if(!factorId)return msg('No authenticator factor is ready.');if(!/^\d{6}$/.test(code))return msg('Enter the six-digit authenticator code.');$('verify').disabled=true;try{const ch=await supabase.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;const v=await supabase.auth.mfa.verify({factorId,challengeId:ch.data.id,code});if(v.error)throw v.error;msg('Google Authenticator is now enabled. Redirecting…','success');setTimeout(()=>location.replace('/dashboard.html'),700)}catch(e){msg(e.message||'Authenticator verification failed.')}finally{$('verify').disabled=false}};</script></body></html>
